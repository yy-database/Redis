name: Check Python

# Wheel build, Python floors and installed-state gate.
# TypeScript: check-typescript.yml. Rust workspace: check-rust.yml.
# Publish: publish-npm.yml on v* tags.
on:
  push:
    branches: [dev, master]
  pull_request:
    branches: [dev, master]
  workflow_call:

env:
  CARGO_TERM_COLOR: always

jobs:
  python:
    name: redis-pyo3 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v6
        with:
          version: 10.18.3
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@nightly
      - run: rustc --version && cargo --version
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: projects/redis.rs
      - name: Install tooling
        run: |
          pnpm install --no-frozen-lockfile
          python -m pip install --quiet "maturin>=1.7,<2.0" pytest "redis==8.1.0"
      - name: Native binding
        run: node scripts/build-platforms.mjs
      - name: Python acceptance
        run: pnpm gate:test-count:py
      - name: Python installed-state gate
        run: pnpm gate:install:py

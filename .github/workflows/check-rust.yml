name: Check Rust

# Rust workspace fmt / build / test. TypeScript: check-typescript.yml
# Python: check-python.yml. Publish: publish-npm.yml on v* tags.
on:
  push:
    branches: [dev, master]
  pull_request:
    branches: [dev, master]
  workflow_call:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust-fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly
          components: rustfmt
      - name: Format check
        run: cargo fmt --manifest-path projects/redis.rs/Cargo.toml --all --check

  rust-bindings:
    name: bindings (build and import)
    runs-on: ubuntu-latest
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: projects/redis.rs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build bindings
        run: cargo build --release --manifest-path projects/redis.rs/Cargo.toml -p redis-napi -p redis-pyo3
      - name: Import Node-API binding
        run: |
          mkdir -p "$RUNNER_TEMP/napi"
          cp projects/redis.rs/target/release/libredis_napi.so "$RUNNER_TEMP/napi/redis_napi.node"
          node -e "
          const binding = require(process.env.RUNNER_TEMP + '/napi/redis_napi.node');
          const decoded = binding.decodeCommand(Buffer.from('*2\r\n\$3\r\nGET\r\n\$1\r\nk\r\n'));
          if (!decoded || decoded.args.length !== 2) process.exit(1);
          const args = decoded.args.map(item => Buffer.from(item).toString());
          if (args.join(' ') !== 'GET k') process.exit(1);
          console.log('napi import ok:', args.join(' '));
          "
      - name: Import pyo3 binding
        run: |
          mkdir -p "$RUNNER_TEMP/pyo3"
          cp projects/redis.rs/target/release/lib_native.so "$RUNNER_TEMP/pyo3/_native.so"
          PYTHONPATH="$RUNNER_TEMP/pyo3" python -c "
          import _native
          frame = b'*2\r\n\$3\r\nGET\r\n\$1\r\nk\r\n'
          consumed, args = _native.decode_command(frame)
          assert consumed == len(frame), consumed
          assert [bytes(item) for item in args] == [b'GET', b'k'], args
          print('pyo3 import ok:', args)
          "

  rust-test:
    name: cargo test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: projects/redis.rs
      - name: Build
        run: cargo build --release --manifest-path projects/redis.rs/Cargo.toml --workspace --exclude redis-napi --exclude redis-pyo3
      - name: Tests
        run: cargo test --release --manifest-path projects/redis.rs/Cargo.toml --workspace --all-targets --exclude redis-napi --exclude redis-pyo3

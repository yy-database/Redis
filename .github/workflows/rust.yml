name: Rust

on:
  push:
    branches: [ master, dev ]
  pull_request:
    branches: [ master, dev ]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - name: Rust Nightly
        uses: actions-rs/toolchain@v1
        with:
            toolchain: nightly-2026-07-20
            override: true
            components: rustfmt, clippy
      - name: Build
        run: cargo build --release --manifest-path projects/redis.rs/Cargo.toml
      - name: Tests
        run: cargo test --release --manifest-path projects/redis.rs/Cargo.toml
  acceptance:
    runs-on: ubuntu-latest
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - name: Rust Nightly
        uses: actions-rs/toolchain@v1
        with:
            toolchain: nightly-2026-07-20
            override: true
      - uses: actions/setup-node@v4
        with:
            node-version: 24
      - uses: actions/setup-python@v5
        with:
            python-version: "3.12"
      - name: Workspace
        run: |
          npm install -g pnpm@10.18.3
          pnpm install
      - name: Python tooling
        run: python -m pip install maturin pytest
      - name: Native binding
        run: node scripts/build-platforms.mjs
      - name: Rust smoke
        run: cargo test --release --manifest-path projects/redis.rs/Cargo.toml -p redis-wasm
      - name: TypeScript acceptance
        run: pnpm gate:test-count:ts
      - name: Python acceptance
        run: pnpm gate:test-count:py
      - name: TypeScript installed-state gate
        run: pnpm gate:install:ts
      - name: Python installed-state gate
        run: pnpm gate:install:py
      - name: Cross implementation oracle
        run: pnpm gate:oracle

name: Check TypeScript

# pnpm install, native binding, TypeScript floors, install-state, oracle and drivers.
# Python: check-python.yml. Rust workspace: check-rust.yml.
# Publish: publish-npm.yml on v* tags.
on:
  push:
    branches: [dev, master]
  pull_request:
    branches: [dev, master]
  workflow_call:

jobs:
  typescript:
    name: pnpm packages
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:8.10.3
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: pnpm/action-setup@v6
        with:
          version: 10.18.3
      - uses: dtolnay/rust-toolchain@nightly
      - run: rustc --version && cargo --version
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: projects/redis.rs
      - name: Install dependencies
        run: |
          pnpm install --no-frozen-lockfile
          python -m pip install --quiet "redis==8.1.0"
      - name: Native binding
        run: node scripts/build-platforms.mjs
      - name: TypeScript acceptance
        run: pnpm gate:test-count:ts
      - name: TypeScript installed-state gate
        run: pnpm gate:install:ts
      - name: Cross implementation oracle
        run: pnpm gate:oracle
      - name: Live Redis oracle
        run: pnpm gate:oracle:live
        env:
          REDIS_ORACLE_HOST: 127.0.0.1
          REDIS_ORACLE_PORT: "6379"
      - name: Live Redis oracle (RESP3)
        run: pnpm gate:oracle:live:resp3
        env:
          REDIS_ORACLE_HOST: 127.0.0.1
          REDIS_ORACLE_PORT: "6379"
      - name: Live Redis oracle (blocking)
        run: pnpm gate:oracle:live:blocking
        env:
          REDIS_ORACLE_HOST: 127.0.0.1
          REDIS_ORACLE_PORT: "6379"
      - name: Real driver conformance
        run: pnpm gate:drivers

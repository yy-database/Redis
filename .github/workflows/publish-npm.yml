name: publish-npm

# Trusted Publisher contract (sole npm trusted workflow — keep this filename):
#   file = publish-npm.yml
#   repo = yy-database/Redis
#   env  = NPM_PUBLISH
#
# Real `@yydb/redis*` versions publish only through npm Trusted Publisher
# (OIDC) on tag push. Local `nifty publish --placeholder` is only for 0.0.0 stubs.
# `--refresh` re-reads the registry first, so versions already published under
# this name (for example `@yydb/redis@0.1.0`) are skipped instead of republished.
#
# Runs only after Check Rust, Check TypeScript and Check Python all succeed
# on this tag (re-run via workflow_call).
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag (for example v0.0.1). Its version is published."
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  check-rust:
    name: Gate rust
    uses: ./.github/workflows/check-rust.yml

  check-typescript:
    name: Gate typescript
    uses: ./.github/workflows/check-typescript.yml

  check-python:
    name: Gate python
    uses: ./.github/workflows/check-python.yml

  build-native:
    name: Native ${{ matrix.short }}
    needs: [check-rust, check-typescript, check-python]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            short: win32-x64
          - os: ubuntu-latest
            short: linux-x64
          - os: macos-15-intel
            short: darwin-x64
          - os: macos-latest
            short: darwin-arm64
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - run: rustc --version && cargo --version
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.3
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm install --no-frozen-lockfile
      - name: Build N-API
        run: node scripts/build-platforms.mjs --release
      - name: Upload native artifact
        uses: actions/upload-artifact@v7
        with:
          name: native-${{ matrix.short }}
          path: projects/redis.ts/platforms/redis-${{ matrix.short }}/redis.${{ matrix.short }}.node
          if-no-files-found: error

  publish:
    name: Publish packages
    needs: [check-rust, check-typescript, check-python, build-native]
    runs-on: ubuntu-latest
    environment: NPM_PUBLISH
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.3
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          package-manager-cache: false
      - uses: dtolnay/rust-toolchain@nightly
      - run: rustc --version && cargo --version
      - name: Upgrade npm for Trusted Publisher support
        run: npm install --global npm@11
      - run: pnpm install --no-frozen-lockfile
      - name: Download native artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: _natives
          merge-multiple: false
      - name: Stage native bindings
        shell: bash
        run: |
          set -euo pipefail
          for dir in _natives/native-*; do
            short="${dir##*/native-}"
            dest="projects/redis.ts/platforms/redis-${short}/redis.${short}.node"
            src="$dir/redis.${short}.node"
            if [[ ! -f "$src" ]]; then
              # upload-artifact may flatten a single-file upload
              src="$(find "$dir" -type f -name "redis.${short}.node" | head -n 1)"
            fi
            test -f "$src"
            cp "$src" "$dest"
            ls -la "$dest"
          done
      - run: pnpm --filter @yydb/redis build
      - name: Publish packages to npm
        run: pnpm exec nifty publish --access public --refresh --version="${RELEASE_TAG#v}"

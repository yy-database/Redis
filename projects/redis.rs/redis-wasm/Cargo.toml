[package]
name = "redis-wasm"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Portable RESP and YYDS storage primitives shared by every binding"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
database-formats = { workspace = true }
database-types = { workspace = true }
serde_json = { workspace = true }

# `database-types` reaches `getrandom` 0.4 through `uuid`; on
# `wasm32-unknown-unknown` that backend is gated behind `wasm_js`.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[workspace]
resolver = "2"
members = [
    "redis-napi",
    "redis-pyo3",
    "redis-wasm",
]
default-members = ["redis-wasm"]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Yggdrasill Team <192607617@qq.com>"]
license = "MPL-2.0"
repository = "https://github.com/yy-database/Redis"

[workspace.dependencies]
# 上游提供 `.yyds` 目录与 `.yykv` 分片的字节布局、执行器契约与 Redis 命令族入口，
# 这里钉在 `dev` 的提交上，该提交同时携带六种 Redis 值类型、带 `SCAN TYPE`
# 的键空间族入口（`KEYS` / `SCAN` / `TYPE` / `OBJECT`）、`RENAME`、
# 带 `SET ... GET` 的字符串与键族入口、`OBJECT ENCODING`、`SETNX`、`PSETEX`、
# `MSET`、`FLUSHDB`、zset 集合运算、排序与 bitfield 族、`LPOS`、HyperLogLog
# 族、hash 与 set 的公开命令入口、带 `LMPOP` 的 list 族入口、阻塞 list 与 zset
# 命令的非阻塞复放入口、`CLIENT`/`COMMAND`/`INFO`/`CONFIG`/`ACL` 的内嵌服务端会话，
# 以及 harness 的 bench provenance（跨运行场景格 provenance）与
# gate tally 关闭判定修复（cases 与状态计数不一致时关闸）。
database-formats = { git = "https://github.com/oovm/database.rs.git", rev = "657eaa96884f6f359f4db0136d37669c652bca70", package = "database-formats" }
database-types = { git = "https://github.com/oovm/database.rs.git", rev = "657eaa96884f6f359f4db0136d37669c652bca70", package = "database-types" }
database-execution = { git = "https://github.com/oovm/database.rs.git", rev = "657eaa96884f6f359f4db0136d37669c652bca70", package = "database-execution" }
database-query = { git = "https://github.com/oovm/database.rs.git", rev = "657eaa96884f6f359f4db0136d37669c652bca70", package = "database-query" }
database-server = { git = "https://github.com/oovm/database.rs.git", rev = "657eaa96884f6f359f4db0136d37669c652bca70", package = "database-server" }
database = { git = "https://github.com/oovm/database.rs.git", rev = "657eaa96884f6f359f4db0136d37669c652bca70", package = "database", default-features = false }
napi = { version = "3.14.2", default-features = false, features = ["napi4", "napi6"] }
napi-derive = "3.6.12"
napi-build = "2.6"
pyo3 = { version = "0.30.1", features = ["extension-module"] }
serde_json = "1"

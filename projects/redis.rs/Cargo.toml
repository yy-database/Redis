[workspace]
resolver = "2"
members = [
    "redis-napi",
    "redis-pyo3",
    "redis-wasm",
]
default-members = ["redis-wasm"]

[workspace.package]
version = "0.0.0"
edition = "2024"
authors = ["Yggdrasill Team <192607617@qq.com>"]
license = "MPL-2.0"
repository = "https://github.com/yy-database/Redis"

[workspace.dependencies]
# Upstream byte layouts for the `.yyds` catalog and the `.yykv` shard, pinned to
# the `dev` tip that carries all five Redis value kinds, `SCAN`, `RENAME` and the
# string range, float and bit command family.
database-formats = { git = "https://github.com/oovm/database.rs.git", rev = "cb0cfeb4d7c6cf5f2ced93b7baa817f823e343ec", package = "database-formats" }
database-types = { git = "https://github.com/oovm/database.rs.git", rev = "cb0cfeb4d7c6cf5f2ced93b7baa817f823e343ec", package = "database-types" }
napi = { version = "3.14.2", default-features = false, features = ["napi4", "napi6"] }
napi-derive = "3.6.12"
napi-build = "2.6"
pyo3 = { version = "0.30.1", features = ["extension-module"] }
serde_json = "1"

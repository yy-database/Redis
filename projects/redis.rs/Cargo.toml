[workspace]
resolver = "2"
members = [
    "redis-napi",
    "redis-pyo3",
    "redis-wasm",
]
default-members = ["redis-wasm"]

[workspace.package]
version = "0.0.0"
edition = "2024"
authors = ["Yggdrasill Team <192607617@qq.com>"]
license = "MPL-2.0"
repository = "https://github.com/yy-database/Redis"

[workspace.dependencies]
# Upstream byte layouts for the `.yyds` catalog and the `.yykv` shard plus the
# executor contract and the Redis command facade, pinned to the `dev` tip that
# carries all five Redis value kinds, `SCAN`, `RENAME`, the string range, float
# and bit command family, the zset algebra, sort and bitfield families, `LPOS`,
# the HyperLogLog family, and the public hash and set command entries.
database-formats = { git = "https://github.com/oovm/database.rs.git", rev = "dd548c2902126dd6508db76cafa212cb74d85cd8", package = "database-formats" }
database-types = { git = "https://github.com/oovm/database.rs.git", rev = "dd548c2902126dd6508db76cafa212cb74d85cd8", package = "database-types" }
database-execution = { git = "https://github.com/oovm/database.rs.git", rev = "dd548c2902126dd6508db76cafa212cb74d85cd8", package = "database-execution" }
database-query = { git = "https://github.com/oovm/database.rs.git", rev = "dd548c2902126dd6508db76cafa212cb74d85cd8", package = "database-query" }
database-server = { git = "https://github.com/oovm/database.rs.git", rev = "dd548c2902126dd6508db76cafa212cb74d85cd8", package = "database-server" }
napi = { version = "3.14.2", default-features = false, features = ["napi4", "napi6"] }
napi-derive = "3.6.12"
napi-build = "2.6"
pyo3 = { version = "0.30.1", features = ["extension-module"] }
serde_json = "1"

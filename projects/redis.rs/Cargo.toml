[workspace]
resolver = "2"
members = [
    "redis-napi",
    "redis-pyo3",
]
default-members = ["redis-napi"]

[workspace.package]
version = "0.0.0"
edition = "2021"
authors = ["Yggdrasill Team <192607617@qq.com>"]
license = "MPL-2.0"
repository = "https://github.com/yy-database/Redis"

[workspace.dependencies]
pyo3 = { version = "0.30.1", features = ["extension-module"] }

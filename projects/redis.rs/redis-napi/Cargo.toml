[package]
name = "redis-napi"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Node-API binding over the upstream Redis RESP codec and `.yykv` keyspace shard"
publish = false

[lib]
name = "redis_napi"
crate-type = ["cdylib", "rlib"]

[dependencies]
database-execution = { workspace = true }
database-protocol-redis = { workspace = true }
database-query = { workspace = true }
database-server = { workspace = true }
database-storage = { workspace = true }
database-types = { workspace = true }
database = { workspace = true, features = ["harness"] }
napi = { workspace = true }
napi-derive = { workspace = true }
serde_json = { workspace = true }

[build-dependencies]
napi-build = { workspace = true }
